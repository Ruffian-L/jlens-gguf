# gemm-f16 (via candle) uses NEON fullfp16 asm on aarch64. Hosts that don't
# enable it by default (some Cortex cores) fail with:
#   error: instruction requires: fullfp16
# Force +fp16 for aarch64 targets so `cargo build` / `cargo test` work without
# manual RUSTFLAGS. Harmless on CPUs that already have the feature.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+fp16"]
