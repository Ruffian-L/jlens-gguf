[package]
name = "gguf-hooks"
version = "0.1.0"
edition = "2021"
description = "Load GGUF models with candle and hook every residual-stream site in the forward pass"
license = "MIT-0"

[features]
default = ["with-cuda"]
with-cuda = ["candle-core/cuda", "candle-nn/cuda"]
with-metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.22"
tracing = "0.1"
toml = "1"
rand = { version = "0.10", features = ["std", "thread_rng"] }
